<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Primary Meta Tags -->
    <title>Turgomedia - وكالة إبداعية لإنتاج الفيديو وتصميم المواقع وSEO</title>
    <meta name="description" content="Turgomedia هي وكالة إبداعية في السويد تقدم إنتاج فيديو احترافي، وسائل التواصل الاجتماعي، تصوير المنتجات، تصميم المواقع وتحسين محركات البحث لتعزيز علامتك التجارية على الإنترنت." />
    <meta name="keywords" content="Turgomedia، إنتاج فيديو السويد، وكالة وسائل التواصل الاجتماعي، تصوير المنتجات جوتنبرغ، تصميم المواقع، SEO، التسويق الرقمي، وكالة إبداعية" />
    <meta name="author" content="Turgomedia" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Turgomedia - وكالة إبداعية لإنتاج الفيديو وتصميم المواقع وSEO" />
    <meta property="og:description" content="ننشئ محتوى بصري وحلول رقمية تحقق نتائج للشركات السويدية. اكتشف خبرتنا في إنتاج الفيديو، وسائل التواصل الاجتماعي، تصميم المواقع وSEO." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://turgomedia.se/" />
    <meta property="og:image" content="https://turgomedia.se/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Turgomedia - وكالة إبداعية لإنتاج الفيديو وتصميم المواقع وSEO" />
    <meta name="twitter:description" content="إنتاج فيديو احترافي، وسائل التواصل الاجتماعي، تصوير المنتجات، تصميم المواقع وSEO. نحن نساعد الشركات السويدية على النمو رقميًا." />
    <meta name="twitter:image" content="https://turgomedia.se/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Translate Initialization -->
    <div id="google_translate_element" style="display: none;"></div>

    <script type="text/javascript">
      function googleTranslateInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "ar",             // default site language
            includedLanguages: "en,ar,sv",  // restrict to 3
            autoDisplay: false
          },
          "google_translate_element"
        );
      }
    </script>

    <!-- Load Google Translate API securely -->
    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateInit"
    ></script>

    <script>
      // Handle RTL/LTR direction dynamically
      function setDirection(lang) {
        const rtlLanguages = ["ar", "he"];
        if (rtlLanguages.includes(lang)) {
          document.body.setAttribute("dir", "rtl");
        } else {
          document.body.setAttribute("dir", "ltr");
        }
      }

      // Watch for language changes
      document.addEventListener("change", function (e) {
        if (e.target.classList.contains("goog-te-combo")) {
          setDirection(e.target.value);
        }
      });
    </script>
  </body>
</html>
